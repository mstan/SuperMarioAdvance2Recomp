format_version = 1
id = "gbarecomp.feature.gameplay-diagnostics"
version = "1.0.0"
name = "Gameplay Diagnostics"
author = "gbarecomp contributors"
description = "Record bounded local gameplay diagnostics to help investigate problems."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "super-mario-world-us"
rom_sha1 = "5101ddf223d1d918928fe1f306b63a42ada14a5e"

[[feature]]
id = "record-gameplay"
name = "Record Gameplay"
description = "Save a bounded rolling record of inputs and game state for troubleshooting. Turn this off to stop recording. Your choice is remembered."
group = "Diagnostics"
default_enabled = true
